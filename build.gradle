// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        agp_version = '8.11.0'
    }
    repositories {
        google()
        jcenter()
        mavenCentral()
        
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath 'io.github.gradle-nexus:publish-plugin:2.0.0'
        classpath "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:3.1.1"
        classpath 'org.jacoco:org.jacoco.core:0.8.12' //Use latest version

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// plugins required for publishing to maven central
plugins {
    id("io.github.gradle-nexus.publish-plugin") version "2.0.0"
}

apply plugin: 'io.github.gradle-nexus.publish-plugin'

apply from: "${rootDir}/sonatype.gradle"

allprojects {
    repositories {
        google()
        jcenter()
        mavenLocal()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}



// Force all io.netty transitive dependencies to a non-vulnerable version.
// grpc-netty:1.57.2 (pulled by com.google.testing.platform:core) declares Netty 4.1.93.Final
// which has known CVEs. This forces all configurations across all subprojects to 4.2.12.Final.
subprojects {
    configurations.all {
        resolutionStrategy.eachDependency {
            if (requested.group == "io.netty") {
                useVersion("4.2.12.Final")
                because("Netty < 4.2.12.Final has known vulnerabilities (BlackDuck)")
            }
        }
    }
}

